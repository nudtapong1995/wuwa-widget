<script>
    // ลิงก์ CSV อัปเดตล่าสุด
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTgIft7bx4yf5tesksvVJWDPA6oB7CtSg6QH0_XOqbQuRliqOArzTQs7Z1D1nOW2V6Qy868OA9Q_dnk/pub?output=csv';

    function fetchStats() {
        const fetchUrl = SHEET_CSV_URL + '&t=' + new Date().getTime();

        Papa.parse(fetchUrl, {
            download: true,
            skipEmptyLines: 'greedy', // ข้ามแถวที่เป็นช่องว่างทั้งหมด
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length < 2) return;

                let total = 0;
                let win = 0;
                let loss = 0;

                // วนลูปอ่านตั้งแต่แถวที่ 2 (ข้ามหัวตาราง)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    // แปลงค่าเป็น String และตัดช่องว่างออก ป้องกันปัญหาฟอร์แมตไม่ตรง
                    const colA = String(row[0] ?? '').trim().toUpperCase(); // ผ่าน (Win)
                    const colB = String(row[1] ?? '').trim().toUpperCase(); // แตก (Loss)
                    const colD = String(row[3] ?? '').trim();               // คิว
                    const colE = String(row[4] ?? '').trim();               // ชื่อ TikTok

                    // เช็กว่าบรรทัดนี้มีการลงคิวไว้จริงหรือไม่ (มีคิว D หรือ ชื่อ TikTok E)
                    const hasQueue = colD !== '' || colE !== '';

                    if (hasQueue) {
                        total++;

                        // ตรวจสอบสถานะ ผ่าน (Win)
                        if (colA === 'TRUE' || colA === '1' || colA === 'YES') {
                            win++;
                        }
                        // ตรวจสอบสถานะ แตก (Loss)
                        if (colB === 'TRUE' || colB === '1' || colB === 'YES') {
                            loss++;
                        }
                    }
                }

                const played = win + loss;
                const winrate = played > 0 ? Math.round((win / played) * 100) : 0;

                document.getElementById('total').innerText = total;
                document.getElementById('win').innerText = win;
                document.getElementById('loss').innerText = loss;
                document.getElementById('winrate').innerText = winrate + '%';
            }
        });
    }

    fetchStats();
    setInterval(fetchStats, 2000);
</script>
